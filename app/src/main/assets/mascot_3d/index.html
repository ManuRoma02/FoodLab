<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FoodLab 3D Mascot Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent !important;
        }
    </style>
    <script src="three.min.js"></script>
</head>
<body>
<div id="canvas-container" style="width: 100%; height: 100%;"></div>

<script>
    // --- 1. Scene Setup & Transparent WebGL Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0); // 100% Transparent
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // --- 2. Dynamic PBR Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(3, 6, 5);
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
    rimLight.position.set(-4, 2, -3);
    scene.add(rimLight);

    const auraPointLight = new THREE.PointLight(0x22c55e, 1.2, 8);
    auraPointLight.position.set(0, 0, 1.5);
    scene.add(auraPointLight);

    // --- 3. Mascot Hierarchy Root ---
    const mascotGroup = new THREE.Group();
    scene.add(mascotGroup);

    // --- 4. Skeletal Rigged Jelly Slime Mesh ---
    // Slime Body Bones Hierarchy:
    // Root -> Spine (Mid-body) -> Head -> LeftArm & RightArm
    const bones = [];

    const rootBone = new THREE.Bone();
    rootBone.position.y = -1.2;
    bones.push(rootBone);

    const spineBone = new THREE.Bone();
    spineBone.position.y = 0.8;
    rootBone.add(spineBone);
    bones.push(spineBone);

    const headBone = new THREE.Bone();
    headBone.position.y = 0.8;
    spineBone.add(headBone);
    bones.push(headBone);

    const leftArmBone = new THREE.Bone();
    leftArmBone.position.set(-0.9, -0.2, 0);
    spineBone.add(leftArmBone);
    bones.push(leftArmBone);

    const rightArmBone = new THREE.Bone();
    rightArmBone.position.set(0.9, -0.2, 0);
    spineBone.add(rightArmBone);
    bones.push(rightArmBone);

    const skeleton = new THREE.Skeleton(bones);

    // Create Slime Geometry with organic teardrop/droplet shape
    const slimeGeo = new THREE.SphereGeometry(1.25, 42, 42);
    const pos = slimeGeo.attributes.position;
    const skinIndices = [];
    const skinWeights = [];

    for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Organic pear/jelly shaping
        if (y < 0) {
            const factor = 1.0 + Math.abs(y) * 0.35;
            pos.setX(i, x * factor);
            pos.setZ(i, z * factor);
            pos.setY(i, y * 0.85); // flatten bottom base
        } else {
            const factor = 1.0 - y * 0.15;
            pos.setX(i, x * factor);
            pos.setZ(i, z * factor);
        }

        // Rigging weights calculation based on Y height
        const normalizedY = (y + 1.2) / 2.4; // 0 (bottom) to 1 (top)

        if (normalizedY < 0.35) {
            // Weighted to rootBone
            skinIndices.push(0, 1, 0, 0);
            skinWeights.push(1.0 - normalizedY / 0.35, normalizedY / 0.35, 0, 0);
        } else if (normalizedY < 0.7) {
            // Weighted between spineBone and headBone
            const t = (normalizedY - 0.35) / 0.35;
            skinIndices.push(1, 2, 0, 0);
            skinWeights.push(1.0 - t, t, 0, 0);
        } else {
            // Weighted to headBone
            skinIndices.push(2, 1, 0, 0);
            skinWeights.push(0.9, 0.1, 0, 0);
        }
    }

    slimeGeo.computeVertexNormals();
    slimeGeo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
    slimeGeo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));

    // Jelly PBR Material (Glassy, glossy, translucent green)
    const slimeMat = new THREE.MeshPhysicalMaterial({
        color: 0x22c55e,
        roughness: 0.12,
        metalness: 0.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        transmission: 0.45,
        ior: 1.45,
        reflectivity: 0.8,
        transparent: true,
        opacity: 0.95
    });

    const slimeMesh = new THREE.SkinnedMesh(slimeGeo, slimeMat);
    slimeMesh.add(rootBone);
    slimeMesh.bind(skeleton);
    mascotGroup.add(slimeMesh);

    // --- 5. Slime 3D Arms (Skeletal Skinned or Parented) ---
    const armGeo = new THREE.SphereGeometry(0.35, 20, 20);
    armGeo.scale(1.4, 0.7, 0.7);

    const leftArmMesh = new THREE.Mesh(armGeo, slimeMat);
    leftArmMesh.position.set(-0.25, 0, 0);
    leftArmBone.add(leftArmMesh);

    const rightArmMesh = new THREE.Mesh(armGeo, slimeMat);
    rightArmMesh.position.set(0.25, 0, 0);
    rightArmBone.add(rightArmMesh);

    // --- 6. 3D Expressive Face (Eyes, Pupils, Smile) ---
    const faceGroup = new THREE.Group();
    headBone.add(faceGroup);
    faceGroup.position.set(0, -0.4, 0.92);

    const scleraGeo = new THREE.SphereGeometry(0.28, 24, 24);
    scleraGeo.scale(1, 1.15, 0.65);
    const scleraMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });

    const pupilGeo = new THREE.SphereGeometry(0.15, 20, 20);
    pupilGeo.scale(1, 1.1, 0.4);
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

    const glintGeo = new THREE.SphereGeometry(0.05, 12, 12);
    const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Left Eye
    const leftEyeGroup = new THREE.Group();
    leftEyeGroup.position.set(-0.42, 0.15, 0);
    const leftSclera = new THREE.Mesh(scleraGeo, scleraMat);
    const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
    leftPupil.position.set(0.04, 0.02, 0.18);
    const leftGlint = new THREE.Mesh(glintGeo, glintMat);
    leftGlint.position.set(0.07, 0.06, 0.22);
    leftEyeGroup.add(leftSclera, leftPupil, leftGlint);
    faceGroup.add(leftEyeGroup);

    // Right Eye
    const rightEyeGroup = new THREE.Group();
    rightEyeGroup.position.set(0.42, 0.15, 0);
    const rightSclera = new THREE.Mesh(scleraGeo, scleraMat);
    const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
    rightPupil.position.set(-0.04, 0.02, 0.18);
    const rightGlint = new THREE.Mesh(glintGeo, glintMat);
    rightGlint.position.set(-0.02, 0.06, 0.22);
    rightEyeGroup.add(rightSclera, rightPupil, rightGlint);
    faceGroup.add(rightEyeGroup);

    // 3D Smile Tube
    const smileCurve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-0.35, -0.15, 0),
        new THREE.Vector3(0, -0.42, 0.05),
        new THREE.Vector3(0.35, -0.15, 0)
    );
    const smileGeo = new THREE.TubeGeometry(smileCurve, 20, 0.045, 10, false);
    const smileMat = new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.3 });
    const smileMesh = new THREE.Mesh(smileGeo, smileMat);
    smileMesh.position.set(0, 0.05, 0.16);
    faceGroup.add(smileMesh);

    // --- 7. 3D Floating Ghost Companion ---
    const ghostGroup = new THREE.Group();
    scene.add(ghostGroup);

    // Ghost Head & Body
    const ghostHeadGeo = new THREE.SphereGeometry(0.42, 24, 24);
    const ghostSkirtGeo = new THREE.ConeGeometry(0.42, 0.6, 24, 1, true);
    ghostSkirtGeo.rotateX(Math.PI);
    ghostSkirtGeo.translate(0, -0.2, 0);

    const ghostMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0x38bdf8,
        emissiveIntensity: 0.55,
        roughness: 0.2,
        transparent: true,
        opacity: 0.92
    });

    const ghostHead = new THREE.Mesh(ghostHeadGeo, ghostMat);
    const ghostSkirt = new THREE.Mesh(ghostSkirtGeo, ghostMat);
    ghostGroup.add(ghostHead, ghostSkirt);

    // Ghost Cute Eyes & Blush
    const ghostEyeGeo = new THREE.SphereGeometry(0.06, 12, 12);
    const ghostEyeMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
    const gLeftEye = new THREE.Mesh(ghostEyeGeo, ghostEyeMat);
    gLeftEye.position.set(-0.13, 0.06, 0.38);
    const gRightEye = new THREE.Mesh(ghostEyeGeo, ghostEyeMat);
    gRightEye.position.set(0.13, 0.06, 0.38);
    ghostGroup.add(gLeftEye, gRightEye);

    // Ghost Light
    const ghostLight = new THREE.PointLight(0x38bdf8, 1.0, 4);
    ghostGroup.add(ghostLight);

    // --- 8. Dynamic 3D Ground Shadow Plane ---
    const shadowGeo = new THREE.PlaneGeometry(3.5, 3.5);
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = 128;
    shadowCanvas.height = 128;
    const sCtx = shadowCanvas.getContext('2d');
    const gradient = sCtx.createRadialGradient(64, 64, 0, 64, 64, 60);
    gradient.addColorStop(0, 'rgba(0,0,0,0.55)');
    gradient.addColorStop(0.5, 'rgba(0,0,0,0.20)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    sCtx.fillStyle = gradient;
    sCtx.fillRect(0, 0, 128, 128);

    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const shadowMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
    });
    const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
    shadowMesh.rotation.x = -Math.PI / 2;
    shadowMesh.position.y = -1.6;
    scene.add(shadowMesh);

    // --- 9. Animation State Machine & Skeletal Physics ---
    let currentState = 'idle'; // idle | overTarget | typing | party | cooking
    let tapJumpTimer = 0;
    let clock = new THREE.Clock();

    // Interactive Drag / Orbit
    let isDragging = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let targetRotY = 0;
    let targetRotX = 0;
    let currentRotY = 0;
    let currentRotX = 0;

    window.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;
        triggerTap();
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevPointerX;
        const dy = e.clientY - prevPointerY;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;

        targetRotY += dx * 0.012;
        targetRotX += dy * 0.010;
        targetRotX = Math.max(-0.6, Math.min(0.6, targetRotX));
    });

    window.addEventListener('pointerup', () => { isDragging = false; });
    window.addEventListener('pointercancel', () => { isDragging = false; });

    function triggerTap() {
        tapJumpTimer = 1.0;
        try {
            if (window.AndroidBridge && window.AndroidBridge.onMascotTapped) {
                window.AndroidBridge.onMascotTapped();
            }
        } catch (_) {}
    }

    window.setMascotState = function(newState) {
        currentState = newState || 'idle';
        if (currentState === 'overTarget') {
            slimeMat.color.setHex(0xef4444);
            auraPointLight.color.setHex(0xef4444);
        } else if (currentState === 'party') {
            slimeMat.color.setHex(0xffd600);
            auraPointLight.color.setHex(0xffd600);
            ghostMat.emissive.setHex(0xf43f5e);
        } else if (currentState === 'typing') {
            slimeMat.color.setHex(0x38bdf8);
            auraPointLight.color.setHex(0x38bdf8);
        } else {
            slimeMat.color.setHex(0x22c55e);
            auraPointLight.color.setHex(0x22c55e);
            ghostMat.emissive.setHex(0x38bdf8);
        }
    };

    window.triggerTap = triggerTap;

    // --- 10. 60/120 FPS Skeletal Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        // 1. Smooth 3D Rotation Interpolation with return-to-center spring
        if (!isDragging) {
            targetRotY *= 0.94; // gently decay back to front
            targetRotX *= 0.94;
        }
        currentRotY += (targetRotY - currentRotY) * 0.12;
        currentRotX += (targetRotX - currentRotX) * 0.12;

        mascotGroup.rotation.y = currentRotY;
        mascotGroup.rotation.x = currentRotX;

        // 2. Skeletal Breathing & Jelly Deformation
        const breath = Math.sin(elapsedTime * 2.8) * 0.06;
        const sway = Math.sin(elapsedTime * 2.0) * 0.08;

        // Spine deformation
        spineBone.position.y = 0.8 + breath;
        spineBone.rotation.z = sway;
        headBone.rotation.z = -sway * 0.6;

        // Arms animation
        if (currentState === 'party') {
            leftArmBone.rotation.z = Math.PI * 0.65 + Math.sin(elapsedTime * 8.0) * 0.4;
            rightArmBone.rotation.z = -Math.PI * 0.65 - Math.sin(elapsedTime * 8.0) * 0.4;
            headBone.rotation.y = Math.sin(elapsedTime * 6.0) * 0.3;
        } else if (currentState === 'typing') {
            leftArmBone.rotation.z = Math.PI * 0.2 + Math.sin(elapsedTime * 12.0) * 0.25;
            rightArmBone.rotation.z = -Math.PI * 0.2 - Math.cos(elapsedTime * 12.0) * 0.25;
        } else {
            leftArmBone.rotation.z = Math.PI * 0.25 + Math.sin(elapsedTime * 2.5) * 0.12;
            rightArmBone.rotation.z = -Math.PI * 0.25 - Math.sin(elapsedTime * 2.5) * 0.12;
        }

        // 3. Jump & Jelly Squash-Stretch Physics
        if (tapJumpTimer > 0) {
            tapJumpTimer -= 0.045;
            const jumpPhase = Math.sin((1.0 - tapJumpTimer) * Math.PI);
            mascotGroup.position.y = jumpPhase * 0.65;
            // Squash and stretch scale
            mascotGroup.scale.set(1.0 - jumpPhase * 0.12, 1.0 + jumpPhase * 0.22, 1.0 - jumpPhase * 0.12);
            shadowMesh.scale.setScalar(1.0 - jumpPhase * 0.35);
        } else {
            mascotGroup.position.y = Math.sin(elapsedTime * 2.8) * 0.08;
            mascotGroup.scale.set(1.0, 1.0, 1.0);
            shadowMesh.scale.setScalar(1.0);
        }

        // 4. Ghost 3D Orbital Path
        const ghostOrbitRadius = 1.65;
        const ghostSpeed = 1.4;
        const ghostAngle = elapsedTime * ghostSpeed;
        ghostGroup.position.x = Math.cos(ghostAngle) * ghostOrbitRadius;
        ghostGroup.position.z = Math.sin(ghostAngle) * ghostOrbitRadius * 0.85;
        ghostGroup.position.y = 1.1 + Math.sin(elapsedTime * 3.5) * 0.25;
        ghostGroup.rotation.y = -ghostAngle + Math.PI / 2;

        // Ghost tail wiggle
        ghostSkirt.rotation.z = Math.sin(elapsedTime * 6.0) * 0.2;

        // 5. Eye Tracking
        const pupilTrackX = Math.max(-0.06, Math.min(0.06, currentRotY * 0.15));
        const pupilTrackY = Math.max(-0.06, Math.min(0.06, -currentRotX * 0.15));
        leftPupil.position.x = 0.04 + pupilTrackX;
        leftPupil.position.y = 0.02 + pupilTrackY;
        rightPupil.position.x = -0.04 + pupilTrackX;
        rightPupil.position.y = 0.02 + pupilTrackY;

        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
