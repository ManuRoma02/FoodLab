<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian to Midnight Carbon) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E13"/>
      <stop offset="50%" stop-color="#11161D"/>
      <stop offset="100%" stop-color="#161D26"/>
    </linearGradient>

    <!-- Radial Ambient Atmosphere -->
    <radialGradient id="ambient-glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bio-Slime Body Gradients -->
    <linearGradient id="slime-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="75%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <radialGradient id="slime-inner-core" cx="48%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#22C55E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Specular Shimmer -->
    <linearGradient id="specular-crest" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ghost Pearlescent Gradient -->
    <linearGradient id="ghost-grad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <radialGradient id="ghost-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Macro Energy Drops -->
    <linearGradient id="carb-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fat-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- LAYER 1: BACKGROUND (Full-bleed 512x512)   -->
  <!-- ========================================== -->
  <g id="background">
    <rect width="512" height="512" fill="url(#bg-grad)"/>
    <rect width="512" height="512" fill="url(#ambient-glow)"/>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 2: FOREGROUND GLYPH (Centered Safe)  -->
  <!-- ========================================== -->
  <g id="foreground">
    <!-- Contact Floor Shadow -->
    <ellipse cx="236" cy="406" rx="120" ry="18" fill="#000000" fill-opacity="0.45"/>
    <ellipse cx="236" cy="406" rx="80" ry="10" fill="#000000" fill-opacity="0.35"/>

    <!-- Mascot Body Shadow Edge -->
    <path d="M 140 370 C 130 380, 150 405, 185 410 C 235 416, 280 412, 320 405 C 345 400, 360 380, 345 365 C 320 375, 260 382, 210 380 Z" fill="#064E3B" fill-opacity="0.5"/>

    <!-- Main Slime Body -->
    <path id="slime-base" d="M 236 145 C 175 145, 132 195, 126 270 C 122 315, 105 335, 115 365 C 125 395, 160 408, 236 408 C 312 408, 347 395, 357 365 C 367 335, 350 315, 346 270 C 340 195, 297 145, 236 145 Z" fill="url(#slime-grad)"/>

    <!-- Inner Bioluminescent Core -->
    <ellipse cx="236" cy="305" rx="88" ry="76" fill="url(#slime-inner-core)"/>

    <!-- Left Arm -->
    <path d="M 128 290 C 100 305, 95 338, 120 350 C 135 356, 148 335, 142 310 Z" fill="#22C55E"/>
    <path d="M 125 295 C 106 308, 105 330, 122 342" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Right Arm (Friendly wave/hug) -->
    <path d="M 344 290 C 372 305, 377 338, 352 350 C 337 356, 324 335, 330 310 Z" fill="#22C55E"/>
    <path d="M 347 295 C 366 308, 367 330, 350 342" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Cheerful Face -->
    <g id="face">
      <!-- Left Eye -->
      <circle cx="196" cy="248" r="13" fill="#064E3B"/>
      <circle cx="196" cy="248" r="11" fill="#0F172A"/>
      <circle cx="193" cy="244" r="4.5" fill="#FFFFFF"/>
      <circle cx="199" cy="251" r="2" fill="#FFFFFF"/>

      <!-- Right Eye -->
      <circle cx="276" cy="248" r="13" fill="#064E3B"/>
      <circle cx="276" cy="248" r="11" fill="#0F172A"/>
      <circle cx="273" cy="244" r="4.5" fill="#FFFFFF"/>
      <circle cx="279" cy="251" r="2" fill="#FFFFFF"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="178" cy="265" rx="9" ry="5.5" fill="#F87171" fill-opacity="0.38"/>
      <ellipse cx="294" cy="265" rx="9" ry="5.5" fill="#F87171" fill-opacity="0.38"/>

      <!-- Smiling Mouth -->
      <path d="M 222 265 Q 236 280 250 265" stroke="#064E3B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 224 266 Q 236 278 248 266" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 227 268 Q 236 277 245 268" fill="#EF4444" fill-opacity="0.7"/>
    </g>

    <!-- Nutritional Macro Core Badge (Heart/Leaf in belly) -->
    <g id="macro-nutrition-core" transform="translate(236, 335)">
      <!-- Central Energy Leaf -->
      <path d="M 0 -22 C 14 -12, 18 10, 0 20 C -18 10, -14 -12, 0 -22 Z" fill="#DCFCE7" fill-opacity="0.85"/>
      <path d="M 0 -18 L 0 16" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 -6 Q 6 -2 9 -6" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 0 4 Q -6 8 -9 4" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" fill="none"/>

      <!-- Carb (Amber) Satellite Drop -->
      <circle cx="26" cy="4" r="8" fill="url(#carb-amber)"/>
      <circle cx="24" cy="2" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>

      <!-- Fat (Cyan) Satellite Drop -->
      <circle cx="-26" cy="4" r="8" fill="url(#fat-cyan)"/>
      <circle cx="-28" cy="2" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>

    <!-- Liquid Glass Specular Shimmer on Top Crest -->
    <path d="M 160 185 C 185 152, 287 152, 312 185 C 275 165, 195 165, 160 185 Z" fill="url(#specular-crest)"/>
    <ellipse cx="236" cy="162" rx="42" ry="7" fill="#FFFFFF" fill-opacity="0.4"/>

    <!-- Ambient Sparkles / Drops -->
    <circle cx="160" cy="210" r="4" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="310" cy="215" r="3" fill="#FFFFFF" fill-opacity="0.4"/>
    <circle cx="152" cy="340" r="2.5" fill="#BBF7D0" fill-opacity="0.6"/>

    <!-- ========================================== -->
    <!-- COMPANION GHOST (Top-Right Floating)      -->
    <!-- ========================================== -->
    <g id="companion-ghost" transform="translate(365, 150)">
      <!-- Ghost Light Aura -->
      <circle cx="0" cy="0" r="48" fill="url(#ghost-halo)"/>

      <!-- Ghost Body -->
      <path d="M 0 -34 C -24 -34, -32 -10, -28 15 C -26 28, -32 38, -24 38 C -18 38, -14 28, -8 28 C -2 28, 2 36, 8 36 C 14 36, 18 28, 24 28 C 30 28, 30 38, 36 34 C 40 25, 34 8, 30 -5 C 26 -22, 18 -34, 0 -34 Z" fill="url(#ghost-grad)"/>

      <!-- Left Ghost Hand (Waving) -->
      <path d="M -26 5 C -38 0, -42 12, -30 16 C -24 18, -22 10, -26 5 Z" fill="#F0FDF4"/>

      <!-- Right Ghost Hand -->
      <path d="M 28 8 C 38 6, 40 18, 30 20 C 25 21, 24 14, 28 8 Z" fill="#F0FDF4"/>

      <!-- Ghost Face -->
      <circle cx="-7" cy="-7" r="3.8" fill="#0284C7"/>
      <circle cx="-8.5" cy="-8.5" r="1.3" fill="#FFFFFF"/>
      <circle cx="12" cy="-5" r="3.8" fill="#0284C7"/>
      <circle cx="10.5" cy="-6.5" r="1.3" fill="#FFFFFF"/>
      <ellipse cx="2.5" cy="4" rx="4" ry="5.5" fill="#0369A1"/>

      <!-- Ghost Crown Specular Highlight -->
      <path d="M -14 -22 C -8 -30, 8 -30, 14 -22 C 8 -26, -8 -26, -14 -22 Z" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
  </g>
</svg>
